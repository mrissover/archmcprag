services:
  mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - VECTOR_STORE=qdrant
      - QDRANT_URL=http://localhost:6333
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      disable: true
    restart: unless-stopped

  # Optional: Run initial indexing
  initial-load:
    network_mode: host
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["sh", "-c", "sleep 10 && node dist/index.js --initial-load"]
    env_file:
      - .env
    environment:
      - VECTOR_STORE=qdrant
      - QDRANT_URL=http://localhost:6333
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    profiles:
      - init

volumes:
  qdrant_data:
  ollama_data:
